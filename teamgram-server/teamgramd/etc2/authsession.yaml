Name: service.authsession
ListenOn: 0.0.0.0:20450
Etcd:
  Hosts:
    - etcd:2379
  Key: service.authsession
Log:
  ServiceName: service.authsession
  #Mode: file
  #Path: ../logs/authsession
  Level: debug
#监控
Prometheus:
  Host: 0.0.0.0
  Port: 20451
  Path: /metrics
#链路追踪
Telemetry:
  Name: service.authsession
  Endpoint: jaeger:4317
  Sampler: 1.0
  Batcher: otlpgrpc

Mysql:
  # PostgreSQL. The struct field is still named Mysql.
  # KGRAMM_PG_PASSWORD is Secret kgramm key password. The value is not in this file.
  DSN: "host=postgres.kgramm.svc port=5432 user=kgramm password=${KGRAMM_PG_PASSWORD} dbname=kgramm sslmode=disable"
  Active: 64
  Idle: 64
  IdleTimeout: 4h
  
Cache:
  - Host: redis:6379
KV:
  - Host: redis:6379
