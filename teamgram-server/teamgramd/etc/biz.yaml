Name: service.biz_service
ListenOn: 127.0.0.1:20020
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: service.biz_service
Log:
  ServiceName: service.biz_service
  Mode: file
  Path: ../logs/biz
  Level: debug
##监控
#Prometheus:
#  Host: 0.0.0.0
#  Port: 20021
#  Path: /metrics
##链路追踪
#Telemetry:
#  Name: service.biz_service
#  Endpoint: http://127.0.0.1:14268/api/traces
#  Sampler: 1.0
#  Batcher: jaeger

Mysql:
  # PostgreSQL. The struct field is still named Mysql.
  # KGRAMM_PG_PASSWORD is Secret kgramm key password. The value is not in this file.
  DSN: "host=postgres.kgramm.svc port=5432 user=kgramm password=${KGRAMM_PG_PASSWORD} dbname=kgramm sslmode=disable"
  Active: 64
  Idle: 64
  IdleTimeout: 4h

Cache:
  - Host: localhost:6379
KV:
  - Host: localhost:6379

MediaClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.media
IdgenClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen
