Mysql:
  # PostgreSQL. The struct field is still named Mysql.
  # KGRAMM_PG_PASSWORD is Secret kgramm key password. The value is not in this file.
  DSN: "host=postgres.kgramm.svc port=5432 user=kgramm password=${KGRAMM_PG_PASSWORD} dbname=kgramm sslmode=disable"
  Active: 64
  Idle: 64
  IdleTimeout: 4h
Cache:
  - Host: localhost:6379
KV:
  - Host: 127.0.0.1:6379

InboxConsumer:
  Topics:
    - "Inbox-T"
  Brokers:
    - 127.0.0.1:9092
  Group: "Inbox-MainCommunity-S"

IdgenClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.idgen

BizServiceClient:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: service.biz_service

InboxClient:
  Topic:   "Inbox-T"
  Brokers:
    - 127.0.0.1:9092

SyncClient:
  Topic:   "Sync-T"
  Brokers:
    - 127.0.0.1:9092

Redis2:
  Host: 127.0.0.1:6379
  Type: node
