Name: messenger.msg
ListenOn: 127.0.0.1:20030
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: messenger.msg
Timeout: 0
Log:
  ServiceName: messenger.msg
  Mode: file
  Path: ../logs/msg
  Level: debug
